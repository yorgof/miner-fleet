name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a stable version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            printf 'Release must run from a vMAJOR.MINOR.PATCH tag.\n' >&2
            exit 1
          }

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: dist/release
      - name: Verify and publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist/release && sha256sum --check SHA256SUMS)
          test "$(find dist/release -maxdepth 1 -type f | wc -l)" -eq 7
          # Keep a partial/failed publication as a draft. Existing published
          # releases are immutable through this workflow.
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > .work-release-draft; then
            test "$(cat .work-release-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Miner Fleet ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
